[versions]
accompanistPermissions = "0.37.3"
activityCompose = "1.13.0"
agp = "9.3.2"
assertk = "0.28.1"
composeBom = "2026.08.00"
coreKtx = "1.19.0"
datastorePreferences = "1.2.1"
espressoCore = "3.7.0"
junit = "4.13.2"

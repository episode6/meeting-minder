kotlin = "2.4.0"
kotlinxCoroutines = "1.11.0"
kotlinxSerialization = "1.11.0"
ksp = "2.3.12"
lifecycle = "2.11.0"
# material3 is pinned by the compose BOM (2026.08.00 -> 1.4.0); the version here only
# documents what the BOM resolves to
metro = "1.3.0"
navigationCompose = "2.10.1"
# episode6's redux-store-flow: the app's cross-cutting state lives in one StoreFlow
# (see AGENTS.md); the JVM artifacts work on android
redux = "1.1.8"
robolectric = "4.17"
roborazzi = "1.74.0"
# the version roborazzi-compose-preview-scanner-support 1.74.0 is built against
composable-preview-scanner = "0.9.1"
room = "2.8.5"
testCore = "1.7.0"
testRunner = "1.7.0"
turbine = "1.2.1"
workManager = "2.11.2"

